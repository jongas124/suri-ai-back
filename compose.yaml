version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: suri-postgres
    restart: always
    environment:
      POSTGRES_DB: suriai 
      POSTGRES_USER: suri
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: